<!doctype html>
<html>
  <head>
    <title>People</title>
    <style>
      table {
        border-collapse: collapse;
      }
      th, td {
        padding: 8px 20px;
        text-align: left;
      }

      th {
        border-bottom: 1px solid black;
      }
    </style>
  </head>
  <body>
    <h1>Table of Records</h1>
    <table>
      <tr>
        <th>Full Name</th>
        <th>Screen Name</th>
        <th>Identity</th>
      </tr>
      {% for each in data %}
      <tr>
        <td>{{each[0]}}</td>
        <td>{{each[1]}}</td>
        <td>{{each[2]}}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
