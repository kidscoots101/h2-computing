<!DOCTYPE html>

<html>
    <head>
        <title>Web Application</title>
        <style>
            td {
                width: 50px;
                height: 50px;
                border: 1px solid grey;
            }
        </style>
    </head>
    <body>
        <table border="1">
            {% for row in image %}
            <tr>
                {% for colour in row %}
                    <td style="background-color: {{colour}};"></td>
                {% endfor %}
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
